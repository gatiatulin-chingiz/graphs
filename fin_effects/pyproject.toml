[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-effects"
version = "0.1.0"
description = "Расчёт финансового эффекта от сервиса графовой аналитики (поиск мошеннических групп)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
db = ["pyodbc>=5.0"]
notebook = ["jupyterlab>=4.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501"]
